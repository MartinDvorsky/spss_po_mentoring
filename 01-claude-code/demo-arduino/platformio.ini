; PlatformIO – Arduino demo (prednáška 1)
; Kompilácia:  pio run
; Nahratie:    pio run -e uno -t upload

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 9600
